-16.bin", "data/encyclopedia-6b67e35ef1f0-17.bin", "data/encyclopedia-6b67e35ef1f0-18.bin", "data/encyclopedia-6b67e35ef1f0-19.bin", "data/encyclopedia-6b67e35ef1f0-20.bin"]</script>
<script>
'use strict';
(async function(){
const packed=document.getElementById('encyclopedia-data');
if(packed.dataset.encoding==='gzip'||packed.dataset.encoding==='gzip-parts'){
 if(typeof DecompressionStream==='undefined')throw new Error('請使用新版 Chrome、Edge、Firefox 或 Safari 開啟。');
 let blocks;
 if(packed.dataset.encoding==='gzip-parts'){
  const paths=JSON.parse(packed.textContent);blocks=new Array(paths.length);let next=0,done=0;
  const loading=document.createElement('div');loading.className='note';loading.id='loading-progress';loading.setAttribute('role','status');loading.textContent='正在載入百科，請稍候…';document.getElementById('main').append(loading);
  await Promise.all(Array.from({length:Math.min(8,paths.length)},async()=>{while(next<paths.length){const i=next++;let lastError;for(let attempt=0;attempt<3;attempt++){try{const response=await fetch(new URL(paths[i],location.href),{signal:AbortSignal.timeout(45000)});if(!response.ok)throw new Error('資料下載失敗（'+response.status+'）');blocks[i]=await response.arrayBuffer();lastError=null;break}catch(error){lastError=error;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,1000*(attempt+1)))}}if(lastError)throw lastError;done++;loading.textContent='正在載入百科資料 '+done+' / '+paths.length;document.getElementById('save-status').textContent='正在載入 '+Math.round(done/paths.length*100)+'%';}}));
 }else blocks=[Uint8Array.from(atob(packed.textContent.trim()),x=>x.charCodeAt(0))];
 packed.textContent=await new Response(new Blob(blocks).stream().pipeThrough(new DecompressionStream('gzip'))).text();
 delete packed.dataset.encoding;
}

const D=JSON.parse(document.getElementById('encyclopedia-data').textContent),main=document.getElementById('main'),dialog=document.getElementById('detail'),body=document.getElementById('detail-body');
const byId=Object.fromEntries(D.entries.map(e=>[e.id,e])),byDef=Object.fromEntries(D.definitions.map(e=>[e.id,e]));
const chapterNames=['棉花堡','墜落','廢墟','荒原','綠洲','水下','星空玻璃館','回到棉花堡'];
const chapterIds=['cottoncastle','fall','ruins','desert','oasis','underwater','glass','ending'],chapterImages=[2,10,18,35,43,51,61,74];
const S={view:'home',q:'',chapter:'全部',category:'全部',scope:'百科',page:1,storyChapter:'棉花堡',table:'腳本索引',tq:'',tpage:1,gallery:'繪本',gchapter:'全部'};
let focusOrigin=null,lastRoute='home';
const dialogHistory=[];
const mediaByPath=Object.fromEntries((D.media||[]).map(m=>[m.path,m]));
const mediaById=Object.fromEntries((D.media||[]).map(m=>[m.id,m]));
const stopMedia=()=>dialog.querySelectorAll('audio,video').forEach(m=>m.pause());
const mediaBlock=m=>m&&m.preview?`<section class="media-preview"><h3>${esc(m.name)}</h3>${m.type==='影片'?`<video controls playsinline muted preload="none" poster="${m.poster}" src="${m.preview}"></video>`:`<audio controls preload="none" src="${m.preview}" aria-label="${esc(m.name)} 試聽"></audio>`}<p class="caption">原檔 ${m.seconds} 秒 · ${m.type==='影片'?'前 8 秒無聲預覽（短片顯示全長）':'前 8 秒試聽（短音檔播放全長）'}。來源未改動。</p></section>`:'';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>n.toLocaleString('zh-TW');const image=(key,alt,cls='')=>D.embed[key]?`<img src="${D.embed[key]}" alt="${esc(alt)}" class="${cls}" data-image-key="${esc(key)}" loading="lazy">`:'';
const entryButton=(id)=>byId[id]?`<button data-entry="${esc(id)}">${esc(byId[id].name)}</button>`:'';
const bookKey=n=>'book/p'+String(n).padStart(3,'0')+'.jpg';
const title=(n,txt,intro='')=>`<p class="eyebrow">${n}</p><h1>${txt}</h1>${intro?`<p class="intro">${intro}</p>`:''}`;
const pagebar=(page,total,action)=>`<div class="pagination"><button class="btn" data-page="${action}:${page-1}" ${page<=1?'disabled':''}>上一頁</button><span>${page} / ${Math.max(1,total)}</span><button class="btn" data-page="${action}:${page+1}" ${page>=total?'disabled':''}>下一頁</button></div>`;
const foot=()=>`<p class="fineprint">以本次提供的故事整理。意義欄為作品脈絡下的解讀；腳本與場景紀錄未經 Unity 實跑驗證。<br>原始資料與來源位置可在「製作資料」查閱。</p>`;
function route(view,scroll=true){S.view=view;lastRoute=view;document.querySelectorAll('[data-nav]').forEach(x=>{x.classList.toggle('active',x.dataset.nav===view);x.setAttribute('aria-current',x.dataset.nav===view?'page':'false')});document.getElementById('side').classList.remove('open');document.getElementById('menu').setAttribute('aria-expanded','false');document.getElementById('context').textContent=({home:'專案百科',entries:'百科條目',story:'主線故事',library:'製作資料',gallery:'素材圖庫',changes:'故事同步'})[view]||'專案百科';({home:renderHome,entries:renderEntries,story:renderStory,library:renderLibrary,gallery:renderGallery,changes:renderChanges}[view]||renderHome)();if(scroll)window.scrollTo(0,0)}
function nav(view){if(dialog.open)dialog.close();history.replaceState(null,'','#'+view);route(view)}
function renderHome(){main.innerHTML=`<button class="inline-edit" data-edit-kind="home" data-edit-key="0">編輯首頁文字</button><section class="hero"><div class="hero-copy"><p class="eyebrow">GRADUATION PROJECT · 2026</p><h1>${esc(D.pageCopy.title)}</h1><p>${esc(D.pageCopy.intro).replaceAll('\n','<br>')}</p><div class="hero-actions"><button class="btn primary" data-nav="story">閱讀故事 →</button><button class="btn" data-nav="entries">查閱物件</button></div></div>${image(bookKey(2),'棉花堡既有繪本畫面','hero-img')}</section><p class="caption">棉花堡 · 既有繪本。百科依本次提供的故事整理。</p><div class="section-head"><h2>故事的八個段落</h2><button class="text-button" data-nav="story">完整故事</button></div><div class="chapter-grid">${chapterNames.map((name,i)=>`<button class="chapter-card" data-chapter="${esc(name)}">${image(bookKey(chapterImages[i]),name+'繪本參考')}<h3><span class="number">${String(i+1).padStart(2,'0')}</span>${name}</h3><p>${esc(byId[chapterIds[i]].form)}</p></button>`).join('')}</div><div class="home-bottom"><section><h3>從物件讀進故事</h3><p>查閱形態與動作、在本作中的意義，以及它和角色的關係。</p><div class="inline-links">${['orb','boulder','shelter-true','music-box','photos','shadow','candle','stairs'].map(entryButton).join('')}</div></section><section><h3>製作時的對照</h3><p>四根蠟燭、三張照片與結尾光階，和既有專案仍有差異。故事與程式紀錄分開保存，方便逐項同步。</p><button class="text-button" data-nav="changes">查看 ${D.changes.length} 項故事同步內容 →</button></section></div>${foot()}`}
function entryResults(){let list=S.scope==='百科'?D.entries:D.definitions;return list.filter(e=>{let ch=S.chapter==='全部'||(e.level||'').includes(S.chapter)||(e.level||'')==='全案';let ca=S.category==='全部'||e.category===S.category;let pending=S.scope!=='待確認'||e.pending;let q=(S.q||'').trim().toLocaleLowerCase();let text=[e.id,e.name,e.alias,e.level,e.form,e.meaning,e.relation,e.note,e.originalNames?.join(' ')].filter(Boolean).join(' ').toLocaleLowerCase();return ch&&ca&&pending&&(!q||q.split(/\s+/).every(x=>text.includes(x)))})}
function renderEntries(){const results=entryResults(),limit=18,total=Math.ceil(results.length/limit);S.page=Math.min(S.page,Math.max(1,total));let list=S.scope==='百科'?D.entries:D.definitions;const cats=[...new Set(list.map(e=>e.category))];main.innerHTML=title('02 / ENCYCLOPEDIA','百科條目','從故事裡的形象查起，再追到它的素材、程式與場景位置。')+`<div class="pills" role="group" aria-label="查閱範圍">${['百科','全部物件定義','待確認'].map(x=>`<button class="pill ${S.scope===x?'active':''}" data-scope="${x}">${x}${x==='百科'?' · '+num(D.counts.entries):x==='全部物件定義'?' · '+num(D.counts.definitions):' · '+num(D.counts.pending)}</button>`).join('')}</div><div class="toolbar"><label for="chapter-filter">章節</label><select id="chapter-filter"><option>全部</option>${chapterNames.map(x=>`<option ${S.chapter===x?'selected':''}>${x}</option>`).join('')}</select><label for="category-filter">分類</label><select id="category-filter"><option>全部</option>${cats.map(x=>`<option ${S.category===x?'selected':''}>${esc(x)}</option>`).join('')}</select><button class="text-button" id="reset">清除篩選</button></div><div class="result-line" role="status"><span id="results-count">${num(results.length)} 個${S.scope==='百科'?'條目':'定義'}${S.q?' · 搜尋「'+esc(S.q)+'」':''}</span><span>選擇條目，閱讀完整內容</span></div><div class="entry-list">${results.slice((S.page-1)*limit,S.page*limit).map(e=>{let key=e.images?.[0]||e.image;return `<button class="entry-row" data-${S.scope==='百科'?'entry':'asset'}="${esc(e.id)}"><span class="thumb ${key?'':'text'}">${key?image(key,e.name):esc(e.name.slice(0,1))}</span><span><span class="meta">${esc(e.category)} / ${esc(e.level)}</span><h3>${esc(e.name)}</h3><p>${esc(e.meaning)}</p></span></button>`}).join('')}</div>${!results.length?'<div class="empty">沒有符合的條目。試著換個名稱，或清除章節與分類篩選。</div>':pagebar(S.page,total,'entries')}${S.scope!=='百科'?'<p class="technical-note">同一物件可能有多個素材或節點。定義數量不等於獨立道具數量；技術節點以用途說明。</p>':''}`}
function renderStory(){const ci=chapterNames.indexOf(S.storyChapter),ps=D.paragraphs.filter(p=>p.scene===S.storyChapter);main.innerHTML=title('01 / STORY','主線故事','段落下方的物件名稱，可直接開啟百科說明。編輯模式可修改各段文字。')+`<div class="read-layout"><nav class="chapter-nav" aria-label="故事章節">${chapterNames.map((x,i)=>`<button class="${x===S.storyChapter?'active':''}" data-chapter="${x}">${String(i+1).padStart(2,'0')}　${x}</button>`).join('')}</nav><article class="story-column">${image(bookKey(chapterImages[ci]),S.storyChapter+'既有繪本','chapter-banner')}<p class="caption">圖片為既有繪本參考，細節以故事文字為準。</p><h2>${S.storyChapter}</h2>${ps.map(p=>`<section class="story-para" id="para-${p.k}"><p>${esc(p.text)}</p><button class="inline-edit" data-edit-kind="paragraph" data-edit-key="${p.k}">編輯此段</button><div class="refs"><span>§ ${String(p.k).padStart(3,'0')}</span>${p.entries.map(entryButton).join('')}</div></section>`).join('')}<div class="pagination"><button class="btn" data-chapter="${chapterNames[ci-1]||''}" ${ci===0?'disabled':''}>← 上一章</button><span>${ci+1} / 8</span><button class="btn" data-chapter="${chapterNames[ci+1]||''}" ${ci===7?'disabled':''}>下一章 →</button></div></article></div>`}
function renderLibrary(){const t=D.tables[S.table],q=S.tq.toLowerCase().trim();const matches=t.rows.map((row,i)=>({row,i})).filter(({row})=>!q||row.some(v=>String(v??'').toLowerCase().includes(q)));const limit=35,total=Math.ceil(matches.length/limit);S.tpage=Math.min(S.tpage,Math.max(1,total));main.innerHTML=title('03 / PRODUCTION','製作資料','腳本、素材、分鏡與來源索引。歷史紀錄保留當時版本；目前故事設定請查百科正文。')+`<div class="toolbar"><label for="table-select">資料表</label><select id="table-select">${Object.keys(D.tables).map(n=>`<option ${S.table===n?'selected':''}>${esc(n)}</option>`).join('')}</select><input type="search" class="table-search" id="table-search" aria-label="搜尋目前資料表" placeholder="搜尋此表的名稱、路徑或內容" value="${esc(S.tq)}"><button class="btn" id="export-csv">匯出篩選 CSV</button></div><p class="technical-note">${esc(t.note||'初始資料與 Excel 對應工作表一致；網頁修改不會回寫 Excel。')} 點選「展開」可讀取完整欄位。</p><div class="result-line" role="status"><span id="table-count">${num(matches.length)} / ${num(t.rows.length)} 筆</span><span>${esc(S.table)}</span></div><div class="table-wrap" tabindex="0" role="region" aria-label="${esc(S.table)}，可水平捲動"><table class="data-table"><thead><tr><th>完整內容</th>${t.headers.map(h=>`<th scope="col">${esc(h)}</th>`).join('')}</tr></thead><tbody>${matches.slice((S.tpage-1)*limit,S.tpage*limit).map(({row,i})=>`<tr><td><button class="row-open" data-row="${i}">展開 ${esc(row[0])}</button></td>${row.map(v=>`<td><div>${esc(v)}</div></td>`).join('')}</tr>`).join('')}</tbody></table></div>${!matches.length?'<div class="empty">此表沒有符合的資料。</div>':''}${pagebar(S.tpage,total,'library')}`}
function galleryItems(){if(S.gallery==='繪本')return D.book.filter(b=>S.gchapter==='全部'||chapterNames[chapterIds.indexOf(b.level)]===S.gchapter).map(b=>({key:bookKey(b.n),name:`第 ${b.n} 頁 · ${b.label}`,note:'既有繪本 · '+(b.note||'內容以本次故事為準')}));return Object.keys(D.embed).filter(k=>k.startsWith('sprite/')||k.startsWith('diary/')||k.startsWith('_sheets/')).map(k=>({key:k,name:k.split('/').pop(),note:k.startsWith('diary/photo')?'既有照片素材，與新故事構圖分開核對':'專案圖像素材'}))}
function renderGallery(){const items=galleryItems();main.innerHTML=title('04 / IMAGES','素材圖庫','繪本與素材原圖可放大閱讀。收錄代表檔案存在，不代表全部採用。')+`<div class="pills"><button class="pill ${S.gallery==='繪本'?'active':''}" data-gallery="繪本">繪本 74 頁</button><button class="pill ${S.gallery==='素材'?'active':''}" data-gallery="素材">物件與日誌素材</button></div>${S.gallery==='繪本'?`<div class="toolbar"><label for="gallery-chapter">章節</label><select id="gallery-chapter"><option>全部</option>${chapterNames.map(x=>`<option ${x===S.gchapter?'selected':''}>${x}</option>`).join('')}</select></div>`:'<p class="note">三張照片的最新設定依序是她自己、她與伴侶、她與孩子。此處顯示既有素材，前兩張尚未符合新故事構圖。</p>'}<p class="technical-note">${items.length} 張圖片</p><div class="gallery-grid">${items.map(x=>`<button data-image="${esc(x.key)}" data-image-title="${esc(x.name)}">${image(x.key,x.name)}<h3>${esc(x.name)}</h3><p>${esc(x.note)}</p></button>`).join('')}</div>`}
function renderChanges(){main.innerHTML=title('05 / STORY & PROJECT','故事同步','新版故事已作為百科正文。以下保留與現有場景、素材或舊規格的差異，供製作時逐項對照。')+`<div class="sync-list">${D.changes.map((c,i)=>`<article class="sync-item"><button class="inline-edit" data-edit-kind="change" data-edit-key="${i}">編輯對照</button><p class="eyebrow">${String(i+1).padStart(2,'0')}</p><h3>${esc(c[0])}</h3><div class="sync-grid"><div><span class="field-label">最新故事</span><p>${esc(c[1])}</p></div><div><span class="field-label">目前資料</span><p>${esc(c[2])}</p></div></div><p class="sync-action">${esc(c[3])}</p><p class="provenance">${esc(c[5])}</p><div class="inline-links">${entryButton(c[4])}</div></article>`).join('')}</div>`}

const E={enabled:false,ready:false,patches:new Map((D.editorMeta.changes||[]).map(p=>[JSON.stringify(p.path),p])),undo:[],form:null,db:null,pending:0,failed:false,revision:0,exportedRevision:0};
const ed=document.getElementById('edit-dialog'),ef=document.getElementById('edit-fields'),editForm=document.getElementById('edit-form');
const entryFields={name:'名稱',category:'分類',level:'關卡',form:'形態與行動（能指）',meaning:'在本作中的意義（所指）',relation:'符號如何成立',note:'版本註記',basis:'資料性質',implementation:'實作紀錄'};
const defFields={name:'物件或節點',category:'分類',level:'場景',form:'形態',meaning:'意義與用途',note:'限制與版本',basis:'資料性質'};
const readonlyTables=new Set(['閱讀說明','來源','涵蓋核對','全檔案清冊','物件出現位置','物件原名','定義來源','索引','實作索引','音訊與影片查核']);
const mappedTables=new Set(['百科條目','專案物件定義','故事全文','故事對照','故事同步','繪本']);
const clone=x=>JSON.parse(JSON.stringify(x));
function getAt(path){return path.reduce((o,k)=>o?.[k],D)}
function setAt(path,value){let o=D;for(const k of path.slice(0,-1))o=o[k];o[path.at(-1)]=clone(value)}
function validPatch(p){if(!p||!Array.isArray(p.path)||p.path.some(k=>['__proto__','constructor','prototype'].includes(k)))return false;const [a,b,c,d,e]=p.path,v=p.value;
 if(a==='embed'&&p.path.length===2)return (Object.hasOwn(D.embed,b)||/^editor\/(entry|asset)-[a-zA-Z0-9_-]+$/.test(b))&&typeof v==='string'&&v.length<30000000&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v);
 if(a==='entries'&&Number.isInteger(b)&&D.entries[b]){if(c==='images')return p.path.length===3&&Array.isArray(v)&&v.every(x=>typeof x==='string'&&(Object.hasOwn(D.embed,x)||/^editor\/(entry|asset)-[a-zA-Z0-9_-]+$/.test(x)));return p.path.length===3&&Object.hasOwn(entryFields,c)&&typeof v==='string'&&v.length<200000;}
 if(a==='definitions'&&Number.isInteger(b)&&D.definitions[b])return p.path.length===3&&(Object.hasOwn(defFields,c)||(c==='image'&&typeof v==='string'&&(Object.hasOwn(D.embed,v)||/^editor\/(entry|asset)-[a-zA-Z0-9_-]+$/.test(v))))&&typeof v==='string'&&v.length<200000;
 if(a==='paragraphs')return p.path.length===3&&Number.isInteger(b)&&D.paragraphs[b]&&c==='text'&&typeof v==='string'&&v.length<200000;
 if(a==='story')return p.path.length===3&&Number.isInteger(b)&&D.story[b]&&c==='quote'&&typeof v==='string'&&v.length<200000;
 if(a==='changes')return p.path.length===3&&Number.isInteger(b)&&D.changes[b]&&[0,1,2,3,5].includes(c)&&typeof v==='string'&&v.length<200000;
 if(a==='book')return p.path.length===3&&Number.isInteger(b)&&D.book[b]&&['label','note'].includes(c)&&typeof v==='string'&&v.length<200000;
 if(a==='pageCopy')return p.path.length===2&&['title','intro'].includes(b)&&typeof v==='string'&&v.length<200000;
 if(a==='tables')return p.path.length===5&&D.tables[b]&&!readonlyTables.has(b)&&!mappedTables.has(b)&&c==='rows'&&Number.isInteger(d)&&D.tables[b].rows[d]&&Number.isInteger(e)&&e>0&&typeof D.tables[b].rows[d][e]==='string'&&typeof v==='string'&&v.length<200000;
 return false;
}
function syncTables(){
 const update=(name,find,cols)=>{const r=D.tables[name]?.rows.find(find);if(r)for(const [i,v]of Object.entries(cols))r[+i]=v};
 for(const e of D.entries){update('百科條目',r=>r[0]===e.id,{1:e.name,2:e.category,3:e.level,4:e.form,5:e.meaning,6:e.relation,7:e.basis,9:e.note,11:e.links.map(id=>byId[id]?.name||id).join('、')});update('索引',r=>r[1]===e.id,{0:e.category,2:e.name,3:e.level,4:e.form});update('實作索引',r=>r[0]===e.id,{1:e.name,2:e.implementation});e.quotes=e.storyRefs.map(n=>({n,quote:D.story[n-1]?.quote||''}));}
 for(const d of D.definitions)update('專案物件定義',r=>r[0]===d.id,{1:d.name,2:d.category,3:d.level,4:d.form,5:d.meaning,6:d.basis,8:d.note});
 for(const p of D.paragraphs)update('故事全文',r=>r[0]===p.k,{2:p.text,3:p.entries.map(id=>byId[id]?.name||id).join('、')});
 for(const s of D.story)update('故事對照',r=>r[0]===s.n,{2:s.quote,5:s.entries.map(id=>byId[id]?.name||id).join('、')});
 D.tables['故事同步'].rows=D.changes.map(c=>[...c]);
 for(const b of D.book){const r=D.tables['繪本'].rows.find(r=>r[0]===b.n);if(r){const hs=D.tables['繪本'].headers;for(let i=0;i<hs.length;i++){if(hs[i]==='名稱'||hs[i]==='標籤')r[i]=b.label;if(hs[i]==='備註')r[i]=b.note;}}}
}
function status(text){document.getElementById('save-status').textContent=text}
function toast(text){const el=document.getElementById('editor-toast');el.textContent=text;el.hidden=false;clearTimeout(E.toastTimer);E.toastTimer=setTimeout(()=>el.hidden=true,4200)}
function dbRequest(mode,fn){return new Promise((resolve,reject)=>{const tx=E.db.transaction('drafts',mode),req=fn(tx.objectStore('drafts'));let value;req.onsuccess=()=>value=req.result;tx.oncomplete=()=>resolve(value);tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||new Error('儲存被中斷'));});}
async function persist(){const rev=E.revision;E.pending++;status('正在儲存草稿…');try{if(!E.db)throw Error('瀏覽器不支援本機草稿');await dbRequest('readwrite',s=>s.put({id:D.editorMeta.documentId,patches:[...E.patches.values()],at:new Date().toISOString()}));E.failed=false;if(rev===E.revision)status('草稿已存於此瀏覽器 · '+(E.exportedRevision===E.revision?'已下載 HTML':'尚未下載 HTML'));}catch(err){E.failed=true;status('草稿儲存失敗，請下載 HTML 保存修改');}finally{E.pending--;}}
function record(p){setAt(p.path,p.value);E.patches.set(JSON.stringify(p.path),clone(p))}
function commit(patches,label){patches=patches.filter(p=>JSON.stringify(getAt(p.path))!==JSON.stringify(p.value));if(!patches.length)return false;if(!patches.every(validPatch))throw Error('修改包含不支援的欄位或圖片格式。');const undo=patches.map(p=>({path:p.path,value:clone(getAt(p.path)??null),missing:getAt(p.path)===undefined}));patches.forEach(record);E.undo.push({patches:undo,label});E.revision++;syncTables();document.getElementById('undo-edit').disabled=false;persist();return true;}
function refresh(){const target=body.dataset.editTarget?JSON.parse(body.dataset.editTarget):null,isOpen=dialog.open,scroll=window.scrollY;dialogHistory.length=0;if(dialog.open)dialog.close();route(S.view,false);if(isOpen&&target)openTarget(target);window.scrollTo(0,scroll)}
function openTarget(t){if(t.kind==='entry')openEntry(t.key);else if(t.kind==='asset')openAsset(t.key);else if(t.kind==='row'){S.table=t.table;openRow(+t.key)}}
function decorate(target){body.dataset.editTarget=JSON.stringify(target);if(readonlyTables.has(target.table)&&target.kind==='row')return;const h=body.querySelector('h2');h?.insertAdjacentHTML('afterend',`<div class="editor-actions"><button class="inline-edit" data-edit-kind="${esc(target.kind)}" data-edit-key="${esc(target.key)}" data-edit-table="${esc(target.table||'')}">編輯文字</button>${['entry','asset'].includes(target.kind)?`<button class="inline-edit" data-add-image="${target.kind}" data-add-key="${esc(target.key)}">${target.kind==='entry'&&!byId[target.key].images.length||target.kind==='asset'&&!byDef[target.key].image?'新增圖片':'更換首張圖片'}</button>`:''}</div>`)}

const originalEntry=openEntry;openEntry=function(id){originalEntry(id);if(byId[id])decorate({kind:'entry',key:id})};

function specsFor(kind,key,table){let i;
 if(kind==='entry'){i=D.entries.findIndex(e=>e.id===key);return {title:'編輯「'+D.entries[i].name+'」',fields:Object.entries(entryFields).map(([k,label])=>({path:['entries',i,k],label,short:['name','category','level','basis'].includes(k)}))};}
 if(kind==='asset'){i=D.definitions.findIndex(d=>d.id===key);return {title:'編輯「'+D.definitions[i].name+'」',fields:Object.entries(defFields).map(([k,label])=>({path:['definitions',i,k],label,short:['name','category','level','basis'].includes(k)}))};}
 if(kind==='paragraph'){i=D.paragraphs.findIndex(p=>p.k===+key);return {title:'編輯故事 § '+key,hint:'修改段落會同步「故事全文」。百科中的故事摘錄保留原版本，可另外在「故事對照」更新。',fields:[{path:['paragraphs',i,'text'],label:'故事文字'}]};}
 if(kind==='quote')return {title:'編輯故事對照 '+D.story[+key].n,hint:'這段摘錄會同步至相關百科條目；不會改寫故事全文。',fields:[{path:['story',+key,'quote'],label:'原句摘錄'}]};
 if(kind==='change')return {title:'編輯故事同步',fields:[0,1,2,3,5].map((n)=>({path:['changes',+key,n],label:['項目','最新故事','目前資料','製作對照','百科 ID','查核位置'][n],short:n===0}))};
 if(kind==='home')return {title:'編輯首頁文字',fields:[{path:['pageCopy','title'],label:'作品名稱',short:true},{path:['pageCopy','intro'],label:'首頁簡介'}]};
 if(kind==='book')return {title:'編輯繪本說明',fields:[{path:['book',+key,'label'],label:'名稱',short:true},{path:['book',+key,'note'],label:'備註'}]};
 if(kind==='row'){const r=D.tables[table].rows[+key];if(table==='百科條目')return specsFor('entry',r[0]);if(table==='專案物件定義')return specsFor('asset',r[0]);if(table==='故事全文')return specsFor('paragraph',r[0]);if(table==='故事對照')return specsFor('quote',D.story.findIndex(s=>s.n===r[0]));if(table==='故事同步')return specsFor('change',key);if(table==='繪本')return specsFor('book',D.book.findIndex(b=>b.n===r[0]));return {title:'編輯「'+table+'」',hint:'識別碼、數字、檔案清冊及統計保留原值，避免破壞物件連結。',fields:D.tables[table].headers.flatMap((label,n)=>n>0&&typeof r[n]==='string'?[{path:['tables',table,'rows',+key,n],label}]:[])};}
}
function enableEditing(){E.enabled=true;document.body.classList.add('editing');document.getElementById('edit-toggle').textContent='完成編輯';document.getElementById('edit-toggle').setAttribute('aria-pressed','true');document.getElementById('edit-help').hidden=false;}
function startText(kind,key,table){if(!E.ready)return;enableEditing();const spec=specsFor(kind,key,table);if(!spec?.fields.length){toast('這筆資料保留唯讀。');return}E.form={...spec,initial:spec.fields.map(f=>String(getAt(f.path)??''))};document.getElementById('edit-title').textContent=spec.title;ef.innerHTML=(spec.hint?`<p class="editor-hint">${esc(spec.hint)}</p>`:'')+spec.fields.map((f,i)=>`<label for="edit-value-${i}">${esc(f.label)}</label>${f.short?`<input type="text" id="edit-value-${i}" value="${esc(getAt(f.path))}" maxlength="20000">`:`<textarea id="edit-value-${i}" rows="${f.path[0]==='paragraphs'?10:4}" maxlength="190000">${esc(getAt(f.path))}</textarea>`}`).join('');document.getElementById('edit-error').textContent='';document.getElementById('edit-apply').disabled=false;ed.showModal();ef.querySelector('input,textarea')?.focus();}
function startImage(key,attachment=null){if(!E.ready)return;enableEditing();E.form={image:true,key,attachment,uploaded:null};document.getElementById('edit-title').textContent=D.embed[key]?'更換圖片':'新增圖片';const count=[...main.querySelectorAll('img'),...body.querySelectorAll('img')].filter(i=>i.dataset.imageKey===key).length;ef.innerHTML=`<p class="editor-hint">這張圖使用同一份素材的地方都會一起更新，例如圖庫、縮圖或章節封面。原始 Unity 專案不會改動。\n支援 JPG、PNG、WebP，單張上限 20 MB。較大的圖片會縮至最長邊 2,400 像素。</p>${D.embed[key]?`<img class="image-edit-preview" src="${D.embed[key]}" alt="目前圖片">`:''}<label for="replacement-image">選擇新圖片</label><input type="file" id="replacement-image" accept="image/png,image/jpeg,image/webp"><p class="editor-hint" id="image-file-info">${esc(key)}</p>`;document.getElementById('edit-error').textContent='';document.getElementById('edit-apply').disabled=true;ed.showModal();}
async function readImage(file){if(!file||!['image/png','image/jpeg','image/webp'].includes(file.type))throw Error('請選擇 JPG、PNG 或 WebP 圖片。');if(file.size>20*1024*1024)throw Error('圖片超過 20 MB，請先縮小。');const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('圖片讀取失敗。'));r.readAsDataURL(file)});const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(Error('無法讀取這個圖片檔案。'));im.src=data});if(img.width*img.height>60000000)throw Error('圖片像素過大，請先縮小。');if(Math.max(img.width,img.height)<=2400&&file.size<2*1024*1024)return data;const ratio=Math.min(1,2400/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/webp',.9);}
function formDirty(){return E.form?.image?!!E.form.uploaded:E.form?.fields.some((f,i)=>document.getElementById('edit-value-'+i)?.value!==E.form.initial[i])}
function cancelEdit(){if(formDirty()&&!confirm('放棄這次尚未套用的修改？'))return;E.form=null;ed.close()}
function downloadBlob(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function stamp(){return new Date().toLocaleString('sv-SE').replace(/[-: ]/g,'').slice(0,14)}
async function exportHTML(){if(!E.ready)return;document.getElementById('save-html').disabled=true;status('正在製作可攜式 HTML…');try{await new Promise(r=>setTimeout(r,30));const root=document.documentElement.cloneNode(true),meta={...D.editorMeta,documentId:crypto.randomUUID(),changes:[...E.patches.values()],exportedAt:new Date().toISOString()};const text=JSON.stringify({...D,editorMeta:meta}).replaceAll('<','\\u003c').replaceAll('\u2028','\\u2028').replaceAll('\u2029','\\u2029');if(typeof CompressionStream!=='undefined'){
 const packedBytes=new Uint8Array(await new Response(new Blob([text]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());
 let packedString='';for(let i=0;i<packedBytes.length;i+=32768)packedString+=String.fromCharCode(...packedBytes.subarray(i,i+32768));
 root.querySelector('#encyclopedia-data').textContent=btoa(packedString);
 root.querySelector('#encyclopedia-data').dataset.encoding='gzip';
}else{root.querySelector('#encyclopedia-data').textContent=text;delete root.querySelector('#encyclopedia-data').dataset.encoding;}
root.querySelector('#main').innerHTML='';root.querySelector('#detail-body').innerHTML='';root.querySelector('#detail-body').removeAttribute('data-edit-target');root.querySelector('#edit-fields').innerHTML='';root.querySelectorAll('dialog').forEach(x=>x.removeAttribute('open'));root.querySelector('body').classList.remove('editing');root.querySelector('#edit-toggle').textContent='編輯內容';root.querySelector('#edit-toggle').setAttribute('aria-pressed','false');root.querySelector('#edit-help').hidden=true;root.querySelector('#edit-more').hidden=true;root.querySelector('#editor-more').setAttribute('aria-expanded','false');root.querySelector('#editor-toast').hidden=true;root.querySelector('#undo-edit').disabled=true;root.querySelector('#save-status').textContent='正在準備編輯功能…';root.querySelector('#search').value='';downloadBlob(new Blob(['<!DOCTYPE html>\n'+root.outerHTML],{type:'text/html;charset=utf-8'}),'index.html');E.exportedRevision=E.revision;status('已產生 HTML 下載 · 請保留下載的新檔案');toast('新版 HTML 已送出下載，可離線開啟並繼續編輯。')}catch(err){status('HTML 匯出失敗，請重試或備份修改');toast(err.message)}finally{document.getElementById('save-html').disabled=false}}
async function initEditor(){try{E.db=await new Promise((resolve,reject)=>{const req=indexedDB.open('wnt-encyclopedia-editor-v1',1);req.onupgradeneeded=()=>req.result.createObjectStore('drafts',{keyPath:'id'});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);req.onblocked=()=>reject(Error('草稿資料庫暫時無法使用'))});const draft=await dbRequest('readonly',s=>s.get(D.editorMeta.documentId));if(draft?.patches?.length){if(!draft.patches.every(validPatch))throw Error('草稿資料格式不符');draft.patches.forEach(record);syncTables();refresh();E.revision=1;status('已恢復此瀏覽器的草稿 · 尚未下載 HTML')}else status('可編輯、離線保存 · 尚無新修改');}catch(err){E.failed=true;status('本機草稿無法使用；修改後請下載 HTML');}E.ready=true;document.getElementById('edit-toggle').disabled=false;document.getElementById('save-html').disabled=false;}
// Capture edit controls before the reading interface handles image/navigation clicks.
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-edit-kind],[data-add-image]');if(b){ev.preventDefault();ev.stopImmediatePropagation();if(b.dataset.addImage){const kind=b.dataset.addImage,id=b.dataset.addKey,i=(kind==='entry'?D.entries:D.definitions).findIndex(x=>x.id===id),obj=(kind==='entry'?D.entries:D.definitions)[i],key=(kind==='entry'?obj.images[0]:obj.image)||'editor/'+kind+'-'+id;startImage(key,kind==='entry'?{path:['entries',i,'images'],value:[key,...obj.images.slice(1)]}:{path:['definitions',i,'image'],value:key});}else startText(b.dataset.editKind,b.dataset.editKey,b.dataset.editTable);return}const img=ev.target.closest('img[data-image-key]');if(E.enabled&&img&&!ed.open){ev.preventDefault();ev.stopImmediatePropagation();startImage(img.dataset.imageKey)}},true);
document.getElementById('edit-toggle').onclick=()=>{E.enabled=!E.enabled;document.body.classList.toggle('editing',E.enabled);document.getElementById('edit-toggle').textContent=E.enabled?'完成編輯':'編輯內容';document.getElementById('edit-toggle').setAttribute('aria-pressed',String(E.enabled));document.getElementById('edit-help').hidden=!E.enabled;};
document.getElementById('editor-more').onclick=()=>{const el=document.getElementById('edit-more');el.hidden=!el.hidden;document.getElementById('editor-more').setAttribute('aria-expanded',String(!el.hidden))};
document.getElementById('edit-cancel').onclick=cancelEdit;document.getElementById('edit-cancel-top').onclick=cancelEdit;ed.addEventListener('cancel',ev=>{ev.preventDefault();cancelEdit()});
ef.addEventListener('change',async ev=>{if(ev.target.id!=='replacement-image')return;const form=E.form;form.uploaded=null;document.getElementById('edit-apply').disabled=true;document.getElementById('edit-error').textContent='正在讀取圖片…';try{const file=ev.target.files[0],result=await readImage(file);if(E.form!==form)return;form.uploaded=result;ef.querySelector('.image-edit-preview')?.remove();const img=document.createElement('img');img.className='image-edit-preview';img.src=result;img.alt='替換後預覽';ef.append(img);document.getElementById('image-file-info').textContent=file.name+' · 已準備替換';document.getElementById('edit-error').textContent='';document.getElementById('edit-apply').disabled=false;}catch(err){if(E.form===form)document.getElementById('edit-error').textContent=err.message;}});
editForm.addEventListener('submit',ev=>{ev.preventDefault();try{let patches;if(E.form.image){if(!E.form.uploaded)return;patches=[{path:['embed',E.form.key],value:E.form.uploaded}];if(E.form.attachment)patches.push(E.form.attachment);}else{patches=E.form.fields.map((f,i)=>({path:f.path,value:document.getElementById('edit-value-'+i).value}));if(patches.some(p=>['name','title'].includes(p.path.at(-1))&&!p.value.trim()))throw Error('名稱不能留白。');for(const p of [...patches])if(p.path[0]==='entries'&&p.path[2]==='meaning'){const entry=D.entries[p.path[1]],old=entry.meaning;D.definitions.forEach((d,i)=>{if(d.entryId===entry.id&&d.meaning===old&&d.basis==='百科條目對照')patches.push({path:['definitions',i,'meaning'],value:p.value});});}}
 const changed=commit(patches,E.form.title||'圖片更換');E.form=null;ed.close();refresh();toast(changed?'修改已套用。下載 HTML 即可保存成新檔。':'內容沒有變更。');}catch(err){document.getElementById('edit-error').textContent=err.message}});
document.getElementById('save-html').onclick=exportHTML;
document.getElementById('backup-edits').onclick=()=>downloadBlob(new Blob([JSON.stringify({format:'wnt-editor-edits',version:1,project:D.editorMeta.project,createdAt:new Date().toISOString(),patches:[...E.patches.values()]})],{type:'application/json'}),'我你他_修改備份_'+stamp()+'.json');
document.getElementById('import-edits').onchange=async ev=>{const file=ev.target.files[0];if(!file)return;try{if(file.size>100*1024*1024)throw Error('備份超過 100 MB，請改用完整 HTML。');const data=JSON.parse(await file.text());if(data.format!=='wnt-editor-edits'||data.version!==1||data.project!==D.editorMeta.project||!Array.isArray(data.patches)||!data.patches.every(validPatch))throw Error('這不是同一份百科的有效修改備份。');if(!data.patches.length){toast('備份中沒有修改。');return}if(!confirm('匯入 '+data.patches.length+' 個欄位的修改？相同欄位將以備份內容取代，其餘內容保留。'))return;commit(data.patches,'匯入備份');refresh();toast('修改已合併，可用「復原上次修改」撤回。')}catch(err){toast('無法匯入：'+err.message)}finally{ev.target.value=''}};
document.getElementById('undo-edit').onclick=()=>{const u=E.undo.pop();if(!u)return;for(const p of u.patches){if(p.missing){let o=D;for(const k of p.path.slice(0,-1))o=o[k];delete o[p.path.at(-1)];E.patches.delete(JSON.stringify(p.path));}else record({path:p.path,value:p.value});}E.revision++;syncTables();persist();refresh();document.getElementById('undo-edit').disabled=!E.undo.length;toast('已復原：'+u.label)};
document.addEventListener('keydown',ev=>{if((ev.ctrlKey||ev.metaKey)&&ev.key.toLowerCase()==='s'){ev.preventDefault();if(ed.open)editForm.requestSubmit();else exportHTML()}},true);
window.addEventListener('beforeunload',ev=>{if(formDirty()||E.pending||E.failed&&E.revision!==E.exportedRevision){ev.preventDefault();ev.returnValue=''}});

window.addEventListener('hashchange',loadHash);loadHash();initEditor();
})().catch(error=>{document.getElementById('save-status').textContent='無法載入百科：'+error.message;const p=document.createElement('p');p.className='note';p.textContent='無法載入百科。'+error.message;document.getElementById('main').append(p);});
</script></body></html>
