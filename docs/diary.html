<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="我，你，他：六個得到點的日記照片與背景人聲，點一下才換下一張、下一段。"><title>日記照片與人聲｜我，你，他</title><style>
:root{--paper:#f6f3ed;--ink:#293832;--muted:#6f756c;--line:#dcded3;--green:#354b3d;--gold:#a08451;--card:#fffdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}
a{color:inherit;text-underline-offset:5px}
button{font:inherit;color:inherit}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:16px 4vw;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-family:"Songti TC",serif;font-weight:600;font-size:22px;letter-spacing:3px;text-decoration:none}
.toplinks{display:flex;gap:22px;font-size:13px}
.toplinks a{text-decoration:none}
main{max-width:1180px;margin:auto;padding:40px 4vw 80px}
.hero{padding-bottom:28px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:11px;letter-spacing:3px;color:var(--gold);margin:0 0 12px}
h1{font-family:"Songti TC",serif;font-size:44px;font-weight:500;letter-spacing:6px;line-height:1.4;margin:0 0 12px}
.hero p:not(.eyebrow){font-size:14px;color:var(--muted);margin:4px 0;max-width:46em}
.pair{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:56px;align-items:start;padding-top:40px}
.panel{display:grid;gap:14px;min-width:0}
.panel h2{font-family:"Songti TC",serif;font-size:24px;font-weight:500;letter-spacing:4px;margin:0}
.stage{display:block;width:100%;padding:0;border:0;background:none;cursor:pointer;perspective:1600px;-webkit-tap-highlight-color:transparent}
.stage img{display:block;width:100%;height:auto;aspect-ratio:944/816;transform-origin:50% 50%;transition:transform .28s cubic-bezier(.55,0,.8,.45),opacity .28s;will-change:transform}
.stage img.out{transform:rotateY(-88deg) scale(.96);opacity:.35}
.stage img.pre{transform:rotateY(88deg) scale(.96);opacity:.35;transition:none}
.stage img.in{transition:transform .36s cubic-bezier(.2,.6,.35,1),opacity .36s}
.caption{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:14px}
.caption .idx{font-variant-numeric:tabular-nums;color:var(--gold);letter-spacing:1px}
.caption strong{font-family:"Songti TC",serif;font-size:20px;font-weight:600;letter-spacing:2px}
.caption .sub{color:var(--muted)}
.dots{display:flex;gap:8px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:background .2s}
.dots i.on{background:var(--green)}
.hint{font-size:12px;color:var(--muted);margin:0}
.wheel{display:block;width:min(100%,360px);margin:0 auto;padding:0;border:0;background:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.wheel svg{display:block;width:100%;height:auto;overflow:visible}
#disc{transition:transform .55s cubic-bezier(.3,.7,.25,1);transform-origin:0 0}
.sector{stroke:var(--paper);stroke-width:2}
.sector.on{stroke:var(--gold);stroke-width:2.5}
.lab{font-size:11.5px;fill:var(--ink);letter-spacing:1px;text-anchor:middle;dominant-baseline:middle}
.hub{fill:var(--green)}
.icon{fill:#fff}
.ring-bg{fill:none;stroke:var(--line);stroke-width:4}
.ring{fill:none;stroke:var(--gold);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg)}
.pointer{fill:var(--gold)}
.vmeta{display:grid;gap:6px;justify-items:center;text-align:center}
.vmeta .caption{justify-content:center}
.time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:grid;gap:6px}
.foot p{margin:0}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media(max-width:860px){.pair{grid-template-columns:1fr;gap:44px}h1{font-size:36px;letter-spacing:4px}}
@media(max-width:650px){.topbar{padding:13px 20px}.brand{font-size:20px}.toplinks{font-size:12px;gap:12px}main{padding:28px 20px 60px}h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){.stage img,.stage img.in{transition:opacity .2s}.stage img.out,.stage img.pre{transform:none;opacity:0}#disc{transition:none}}
</style></head><body>
<header class="topbar"><a class="brand" href="index.html">我，你，他</a><nav class="toplinks" aria-label="網站導覽"><a href="index.html">物件百科</a><a href="story.html?version=b">現行故事</a><a href="stage-0925.html">舞台腳本</a></nav></header>
<main>
<header class="hero"><p class="eyebrow">2026.10.01 · 日記頁</p><h1>日記照片與人聲</h1><p>六個得到點的相片正面，和翻面前聽到的旁人聲音。照片和人聲各自點一下才換下一張、下一段。</p></header>
<div class="pair">
<section class="panel" aria-labelledby="photoTitle">
  <h2 id="photoTitle">照片</h2>
  <button class="stage" id="photoBtn" type="button" aria-describedby="photoCap"><img id="photo" src="diary/photo-1.webp" width="944" height="816" alt=""></button>
  <div class="caption" id="photoCap"><span class="idx" id="pIdx">01／06</span><strong id="pName">棉花堡</strong><span class="sub" id="pSub">得到點 1・初次抱起孩子</span></div>
  <div class="dots" id="pDots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
  <p class="hint">點照片換下一張</p>
</section>
<section class="panel" aria-labelledby="voiceTitle">
  <h2 id="voiceTitle">人聲</h2>
  <button class="wheel" id="voiceBtn" type="button" aria-describedby="voiceCap">
    <svg viewBox="-125 -132 250 257" aria-hidden="true">
      <circle class="ring-bg" r="114"/>
      <circle class="ring" id="ring" r="114"/>
      <g id="disc"></g>
      <path class="pointer" d="M-9,-128 L9,-128 L0,-112 Z"/>
      <circle class="hub" r="34"/>
      <path class="icon" id="icon" d="M-9,-13 L15,0 L-9,13 Z"/>
    </svg>
  </button>
  <div class="vmeta">
    <div class="caption" id="voiceCap"><span class="idx" id="vIdx">01／06</span><strong id="vName">棉花堡</strong><span class="sub" id="vSub">探望的人與護理師，疊在一起</span></div>
    <div class="time" id="vTime">0:00／0:07</div>
    <p class="hint">點圓盤：第一次播放，之後每點一次轉到下一段</p>
  </div>
</section>
</div>
<p class="sr" id="live" aria-live="polite"></p>
<footer class="foot"><p>照片：寫實生成圖（2026.10.01）。人聲：合成語音示意，只有旁人的聲音，沒有她的聲音；正式版以組員錄音為準。</p><p>水下三段一次比一次悶，聽不出內容是設計。</p></footer>
</main>
<script>
(function(){
  var P=[
    {name:'棉花堡',sub:'得到點 1・初次抱起孩子',alt:'病房的窗光裡，她坐在床沿抱著包巾裡的孩子，背對鏡頭；床邊桌上有花、禮物袋和一顆氣球；前景兩個探望的人只看得到背影。'},
    {name:'廢墟',sub:'得到點 2・反覆照顧的日常',alt:'夜裡的家，吊燈下一排六個奶瓶，牆上的鐘，地上一籃沒摺的衣服；她背對鏡頭抱著孩子；門口站著一個人，背對著她。'},
    {name:'綠洲',sub:'得到點 3・夜裡的短暫安靜',alt:'深夜的房間，月光從窗戶照進來；她坐在床沿，背對鏡頭；床頭櫃上一個杯子；嬰兒床裡孩子睡著。'},
    {name:'水下・一',sub:'得到點 4・夕陽下的兩人（照片一）',alt:'夕陽下的草原，兩個人牽手跳舞，逆光只剩剪影。'},
    {name:'水下・二',sub:'得到點 5・全家福（照片三）',alt:'全家福，七個人靠牆站成一排，她穿白衣抱著孩子在正中間，一條光帶橫過整排人的臉。'},
    {name:'水下・三',sub:'得到點 6・窗邊的三人（照片二）',alt:'窗光裡，她抱著孩子站在窗前，他站在旁邊，手搭在她背上；兩人背對鏡頭。'}
  ];
  var V=[
    {name:'棉花堡',sub:'探望的人與護理師，疊在一起',color:'#efe1d6'},
    {name:'廢墟',sub:'家人的叮嚀，像從隔壁房間傳來',color:'#e0dcd2'},
    {name:'綠洲',sub:'近處的水聲，遠處一兩句聽不清',color:'#d5e0cd'},
    {name:'水下・一',sub:'隔著水，聽不出內容',color:'#cddae2'},
    {name:'水下・二',sub:'更悶，只剩人聲的起伏',color:'#b8c9d6'},
    {name:'水下・三',sub:'最悶；裡面有他的聲音',color:'#a3b6c8'}
  ];
  var N=6, live=document.getElementById('live');
  function two(n){return (n<10?'0':'')+n}
  function say(t){live.textContent='';setTimeout(function(){live.textContent=t},30)}

  /* 照片：點一下才轉到下一張 */
  var img=document.getElementById('photo'), pBtn=document.getElementById('photoBtn'), pi=0, busy=false;
  var cache=P.map(function(_,i){var im=new Image();im.src='diary/photo-'+(i+1)+'.webp';return im});
  function showPhoto(i){
    img.alt=P[i].alt;
    document.getElementById('pIdx').textContent=two(i+1)+'／06';
    document.getElementById('pName').textContent=P[i].name;
    document.getElementById('pSub').textContent=P[i].sub;
    [].forEach.call(document.querySelectorAll('#pDots i'),function(d,k){d.classList.toggle('on',k===i)});
    pBtn.setAttribute('aria-label','照片 '+(i+1)+'／6：'+P[i].name+'。點一下換下一張');
  }
  function nextPhoto(){
    if(busy)return; busy=true; var ni=(pi+1)%N;
    img.classList.remove('in'); img.classList.add('out');
    setTimeout(function(){
      img.src=cache[ni].src; pi=ni; showPhoto(pi);
      img.classList.remove('out'); img.classList.add('pre'); void img.offsetWidth;
      img.classList.remove('pre'); img.classList.add('in');
      setTimeout(function(){busy=false},360);
      say('照片 '+(pi+1)+'／6：'+P[pi].name);
    },280);
  }
  pBtn.addEventListener('click',nextPhoto);
  showPhoto(0);

  /* 人聲：圓盤，點一下才轉到下一段 */
  var disc=document.getElementById('disc'), ring=document.getElementById('ring'), icon=document.getElementById('icon');
  var vBtn=document.getElementById('voiceBtn'), tEl=document.getElementById('vTime');
  var NS='http://www.w3.org/2000/svg', R=104, C=2*Math.PI*114;
  ring.setAttribute('stroke-dasharray',C); ring.setAttribute('stroke-dashoffset',C);
  V.forEach(function(v,k){
    var a0=(k*60-30-90)*Math.PI/180, a1=(k*60+30-90)*Math.PI/180;
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d','M0,0 L'+(R*Math.cos(a0)).toFixed(2)+','+(R*Math.sin(a0)).toFixed(2)+' A'+R+','+R+' 0 0 1 '+(R*Math.cos(a1)).toFixed(2)+','+(R*Math.sin(a1)).toFixed(2)+' Z');
    p.setAttribute('fill',v.color); p.setAttribute('class','sector'); disc.appendChild(p);
    var g=document.createElementNS(NS,'g'); g.setAttribute('transform','rotate('+(k*60)+') translate(0,-70)');
    var t=document.createElementNS(NS,'text'); t.setAttribute('class','lab'); t.textContent=v.name; g.appendChild(t); disc.appendChild(g);
  });
  var sectors=disc.querySelectorAll('.sector');
  var audios=V.map(function(_,i){var a=new Audio('diary/voice-'+(i+1)+'.mp3');a.preload='metadata';return a});
  var vi=0, rot=0, started=false, raf=0;
  function fmt(x){x=isFinite(x)?Math.max(0,x):0;var m=Math.floor(x/60),s=Math.floor(x%60);return m+':'+(s<10?'0':'')+s}
  function setIcon(play){icon.setAttribute('d',play?'M-11,-11 L11,-11 L11,11 L-11,11 Z':'M-9,-13 L15,0 L-9,13 Z')}
  function showVoice(i){
    document.getElementById('vIdx').textContent=two(i+1)+'／06';
    document.getElementById('vName').textContent=V[i].name;
    document.getElementById('vSub').textContent=V[i].sub;
    [].forEach.call(sectors,function(s,k){s.classList.toggle('on',k===i)});
    vBtn.setAttribute('aria-label',(started?'轉到下一段人聲':'播放人聲')+'（目前 '+(i+1)+'／6：'+V[i].name+'）');
    var a=audios[i]; tEl.textContent=fmt(a.currentTime)+'／'+fmt(a.duration||0);
  }
  function tick(){
    var a=audios[vi], d=a.duration||1, f=Math.min(1,a.currentTime/d);
    ring.setAttribute('stroke-dashoffset',C*(1-f)); tEl.textContent=fmt(a.currentTime)+'／'+fmt(a.duration);
    if(!a.paused&&!a.ended) raf=requestAnimationFrame(tick); else { setIcon(false); }
  }
  function play(i){
    audios.forEach(function(a,k){if(k!==i){a.pause();a.currentTime=0}});
    var a=audios[i]; a.currentTime=0; ring.setAttribute('stroke-dashoffset',C);
    var p=a.play(); setIcon(true); cancelAnimationFrame(raf); raf=requestAnimationFrame(tick);
    if(p&&p.catch)p.catch(function(){setIcon(false);tEl.textContent='無法播放，請再點一次'});
    say('人聲 '+(i+1)+'／6：'+V[i].name+'，播放中');
  }
  audios.forEach(function(a,k){
    a.addEventListener('loadedmetadata',function(){if(k===vi)tEl.textContent=fmt(a.currentTime)+'／'+fmt(a.duration)});
    a.addEventListener('ended',function(){if(k===vi){setIcon(false);ring.setAttribute('stroke-dashoffset',0)}});
  });
  vBtn.addEventListener('click',function(){
    if(!started){started=true;showVoice(vi);play(vi);return}
    vi=(vi+1)%N; rot-=60; disc.style.transform='rotate('+rot+'deg)';
    showVoice(vi); play(vi);
  });
  showVoice(0);
})();
</script>
</body></html>
